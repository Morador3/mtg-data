name: Actualizar datos de Scryfall

on:
  schedule:
    - cron: "30 4 * * *"   # cada día a las 04:30 UTC
  workflow_dispatch:
    inputs:
      include_all_cards:
        description: "Incluir all_cards (todos los idiomas, mucho más pesado)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar y preparar datos
        env:
          INCLUDE_ALL_CARDS: ${{ inputs.include_all_cards && '1' || '0' }}
        run: python scripts/update_data.py

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="data-$(date -u +%Y-%m-%dT%H%M)"
          gh release create "$TAG" dist/* \
            --title "Datos Scryfall $TAG" \
            --notes-file dist/manifest.json \
            --latest

      - name: Conservar solo las 7 releases más recientes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[7:] | .[].tagName' |
          while read -r t; do gh release delete "$t" --yes --cleanup-tag; done
